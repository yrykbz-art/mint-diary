spring:
  datasource:
    url: jdbc:h2:mem:diary;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
app:
  time-zone: Asia/Singapore
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173
