server:
  address: 0.0.0.0
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: mint-diary
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mint_diary?serverTimezone=Asia/Singapore&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:mint_diary}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      initialization-fail-timeout: 60000
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  upload-dir: ${APP_UPLOAD_DIR:./.local/images}
  time-zone: ${APP_TIME_ZONE:Asia/Singapore}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
